name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU training and test dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,test]' build
      - name: Download the pinned model set for integration tests
        run: indra-finetune download --out .model-source --revision v3.1.1 --with-safetensors
      - name: Run unit and released-weight integration tests
        run: python -m pytest -q
      - name: Build the distribution
        run: python -m build

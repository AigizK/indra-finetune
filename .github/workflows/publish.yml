# Publish to PyPI when a version tag (v0.3.0, ...) is pushed. The tag must match the version in
# pyproject.toml; the job stops if they differ, because a published version can't be replaced.
#
# No API token: PyPI trusts this repository and this workflow file (Trusted Publishing), and the
# `id-token` permission below is how the job proves it. A manual run (workflow_dispatch) is a dry
# run: it builds, tests and checks the artifacts, and does not publish.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: Check the tag against the declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          declared=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          tag=${GITHUB_REF_NAME#v}
          echo "tag=$tag declared=$declared"
          if [ "$declared" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $declared in pyproject.toml" >&2
            exit 1
          fi

      # The tests need no models and no network.
      - name: Install and test
        run: |
          uv venv --python 3.12
          uv pip install -e ".[test]"
          uv run --no-sync pytest -q

      - run: uv build

      - name: Check the artifacts
        run: |
          uvx twine check dist/*
          if [ -n "$(find dist -size +20M)" ]; then
            echo "::error::an artifact is over 20 MB; check what the sdist swept in" >&2
            ls -lh dist
            exit 1
          fi

      - name: Check the built version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag=${GITHUB_REF_NAME#v}
          ls -l dist
          for f in dist/*; do
            case "$(basename "$f")" in
              *-"$tag"-*.whl|*-"$tag".tar.gz) ;;
              *) echo "::error::$(basename "$f") is not version $tag" >&2; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only a tag publishes; a manual run stops after build.
    if: startsWith(github.ref, 'refs/tags/')
    # Must match the environment named in PyPI's trusted-publisher entry.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "indra-finetune"
version = "0.2.0"
description = "Recover the Indra OCR line recognizer in PyTorch, fine-tune with CTC, and export to ONNX"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "onnxruntime",
  "pypdfium2",
  "huggingface_hub",
]

[project.urls]
Homepage = "https://github.com/AigizK/indra-finetune"
Repository = "https://github.com/AigizK/indra-finetune"
Upstream = "https://github.com/datalab-to/indra"
Models = "https://huggingface.co/datalab-to/indra-ocr"
Issues = "https://github.com/AigizK/indra-finetune/issues"

[project.optional-dependencies]
tesseract = ["pytesseract"]
test = ["pytest", "pillow", "pikepdf"]
train = ["torch>=2.6,<3", "onnx>=1.17", "safetensors>=0.5", "rapidfuzz>=3.9"]

[project.scripts]
indra-ocr = "indra_ocr.cli:main"
indra-ocr-viewer = "indra_ocr.viewer:main"
indra-finetune = "indra_ocr.finetune.__main__:main"

[tool.setuptools]
packages = ["indra_ocr", "indra_ocr.finetune"]
